<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Rook's app icon. Regenerate every size with: bun run tauri icon src-tauri/app-icon.png
       after rendering this file to a 1024px PNG (e.g. rsvg-convert -w 1024 -h 1024). -->
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
      <stop offset="0" stop-color="#1b1f29"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="754">
      <stop offset="0" stop-color="#f5c97a"/>
      <stop offset="1" stop-color="#d99a3e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- the tile, sized and rounded like macOS app icons (824px inside a 1024px canvas) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>

  <!-- a soft warm glow behind the piece -->
  <ellipse cx="512" cy="540" rx="190" ry="210" fill="#e5b05a" opacity="0.10" filter="url(#glow)"/>

  <!-- the rook -->
  <g fill="url(#gold)">
    <rect x="372" y="290" width="72" height="88" rx="10"/>
    <rect x="476" y="290" width="72" height="88" rx="10"/>
    <rect x="580" y="290" width="72" height="88" rx="10"/>
    <rect x="372" y="360" width="280" height="56" rx="10"/>
    <path d="M396 410 H628 L600 462 H424 Z"/>
    <rect x="424" y="456" width="176" height="200"/>
    <path d="M424 650 H600 L648 704 H376 Z"/>
    <rect x="348" y="696" width="328" height="58" rx="16"/>
  </g>

  <!-- a terminal cursor set into the rook's body -->
  <rect x="488" y="514" width="48" height="84" rx="6" fill="#0b0d12"/>
</svg>
