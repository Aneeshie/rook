name: CI

on:
  pull_request:
  push:
    branches: [main]

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS because Rook is macOS-only, and the PTY tests spawn a real zsh
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # tsc + vite; also produces dist/, which the Rust build embeds
      - run: bun run build

      - run: bun x tsc -p tsconfig.test.json
      - run: bun test

      - run: cargo test --manifest-path src-tauri/Cargo.toml
